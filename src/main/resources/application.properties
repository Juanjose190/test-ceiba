spring.application.name=bike-rental-api
server.error.include-message=never
server.shutdown=graceful

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bike_rental}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bike_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bike_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.security.username=${APP_SECURITY_USERNAME:admin}
app.security.password=${APP_SECURITY_PASSWORD:admin123}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Bike Rental API
info.app.description=API REST para alquiler urbano de bicicletas
