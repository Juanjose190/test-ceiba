spring.application.name=bike-rental-api
server.error.include-message=never
server.shutdown=graceful

app.security.username=${APP_SECURITY_USERNAME:admin}
app.security.password=${APP_SECURITY_PASSWORD:admin123}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Bike Rental API
info.app.description=API REST para alquiler urbano de bicicletas
