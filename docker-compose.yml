services:
  bike-rental-api:
    build: .
    container_name: bike-rental-api
    ports:
      - "8080:8080"
    environment:
      APP_SECURITY_USERNAME: admin
      APP_SECURITY_PASSWORD: admin123
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
